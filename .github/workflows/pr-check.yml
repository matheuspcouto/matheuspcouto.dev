# =============================================================================
# Code Check (PR Validation)
#
# Consumes the reusable workflow code-check.yml from avodah-docs-devops.
#
# Granular skip per job (via PR labels):
#   skip-audit     → skip dependency audit
#   skip-gitleaks  → skip secrets detection
#   skip-lint      → skip ESLint
#   skip-tests     → skip unit tests and coverage
#   skip-build     → skip compilation and artifact validation
# =============================================================================

name: Code Check (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  code-check:
    uses: matheuspcouto/avodah-docs-devops/.github/workflows/code-check.yml@main
    with:
      node-version: '24.13.0'
      coverage-threshold: 80
      install-command: 'npm install --legacy-peer-deps'
