# =============================================================================
# Deploy to PROD
#
# Consumes reusable workflows from avodah-docs-devops.
# Trigger: workflow_dispatch only (manual).
# Flow: code-check → frontend-deploy (build + deploy)
#
# Deploy URLs:
#   - custom-url:  Vercel alias URL (healthcheck)
#   - access-url:  End user access URL
#
# Access: https://matheuspcouto.dev/ (or https://matheuspcouto-dev.vercel.app/)
#
# ⚠️ Use skips with caution in production — recommended only for hotfixes
#    or re-deploys after manual validation.
# =============================================================================

name: Deploy to PROD

on:
  workflow_dispatch:
    inputs:
      skip-audit:
        description: 'Skip dependency audit'
        required: false
        type: boolean
        default: false
      skip-gitleaks:
        description: 'Skip secrets detection'
        required: false
        type: boolean
        default: false
      skip-lint:
        description: 'Skip ESLint'
        required: false
        type: boolean
        default: false
      skip-tests:
        description: 'Skip unit tests and coverage'
        required: false
        type: boolean
        default: false
      skip-build:
        description: 'Skip compilation'
        required: false
        type: boolean
        default: false

jobs:
  code-check:
    uses: matheuspcouto/avodah-docs-devops/.github/workflows/code-check.yml@main
    with:
      node-version: '24.13.0'
      coverage-threshold: 80
      install-command: 'npm install --legacy-peer-deps'
      skip-audit: ${{ inputs.skip-audit || false }}
      skip-gitleaks: ${{ inputs.skip-gitleaks || false }}
      skip-lint: ${{ inputs.skip-lint || false }}
      skip-tests: ${{ inputs.skip-tests || false }}
      skip-build: ${{ inputs.skip-build || false }}

  deploy:
    needs: code-check
    if: always() && !contains(needs.code-check.result, 'failure')
    uses: matheuspcouto/avodah-docs-devops/.github/workflows/frontend-deploy.yml@main
    with:
      deploy-env: 'production'
      custom-url: 'matheuspcouto-dev.vercel.app'
      access-url: 'https://matheuspcouto-dev.vercel.app/'
      git-env: 'production'
      node-version: '24.13.0'
      vercel-cli-version: '54'
    secrets: inherit
